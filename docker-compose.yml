version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
    environment:
      - AWS_SNS_TOPIC_ARN=${AWS_SNS_TOPIC_ARN:-}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - LOG_WINDOW_SIZE=${LOG_WINDOW_SIZE:-100}
      - BASELINE_WARMUP=${BASELINE_WARMUP:-30}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
